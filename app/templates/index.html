{% extends "base.html" %}

{% block content %}
<section class="hero">
  <h1>Welcome to FlaskApp</h1>
  <p>A clean, structured Flask web application.</p>
  {% if not current_user.is_authenticated %}
    <a href="{{ url_for('auth.register') }}" class="btn btn-primary">Get Started</a>
    <a href="{{ url_for('auth.login') }}" class="btn btn-secondary">Login</a>
  {% else %}
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">Go to Dashboard</a>
  {% endif %}
</section>
{% endblock %}
